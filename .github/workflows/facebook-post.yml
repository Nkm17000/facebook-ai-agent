name: Hello API

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Every 5 minutes
    - cron: "*/5 * * 6 *"

jobs:
  test:
    runs-on: ubuntu-latest

    # Available to every step in this job
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Start FastAPI
        run: |
          nohup python -m uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            --log-level debug \
            --access-log > uvicorn.log 2>&1 &

          sleep 5

      - name: Call Home API
        run: |
          echo "========== HOME =========="
          curl http://localhost:8000/

      - name: Call Health API
        run: |
          echo ""
          echo "========== HEALTH =========="
          curl http://localhost:8000/health

      - name: Call Agent API
        run: |
          echo ""
          echo "========== AGENT =========="
          curl http://localhost:8000/agent

      - name: Print Server Logs
        run: |
          echo ""
          echo "========== UVICORN LOGS =========="
          cat uvicorn.log

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log-${{ github.run_number }}
          path: uvicorn.log
