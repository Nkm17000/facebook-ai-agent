name: Hello API

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - run: curl http://localhost:8000/